<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAWT Bracket</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --ink: #201a17;
      --muted: #6e625b;
      --line: #a66c3b;
      --panel: #fffdf9;
      --panel-strong: #fff6df;
      --accent: #8e431d;
      --accent-soft: #f4dfc3;
      --border: #d7b992;
      --shadow: 0 12px 30px rgba(63, 36, 18, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      overflow-x: hidden;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255, 253, 249, 0.85), rgba(246, 241, 232, 0.95)),
        radial-gradient(circle at top left, rgba(166, 108, 59, 0.18), transparent 32rem);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      position: relative;
      width: 100vw;
      padding: 28px 32px 10px;
      text-align: center;
    }

    h1 {
      max-width: calc(100vw - 64px);
      margin: 0;
      font-size: 30px;
      letter-spacing: 0;
    }

    .bracket-shell {
      padding: 22px 30px 40px;
      overflow-x: auto;
    }

    .bracket-stage {
      position: relative;
      width: 1556px;
      margin: 0 auto;
    }

    .bracket {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 148px) 180px repeat(4, 148px);
      gap: 24px;
      min-height: 1px;
      padding: 10px 0;
      z-index: 1;
    }

    .connectors {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .connectors path {
      fill: none;
      stroke: var(--line);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.68;
    }

    .round-column {
      position: relative;
      min-height: 1px;
    }

    .round-column[data-side="left"] {
      text-align: right;
    }

    .round-column[data-side="right"] {
      text-align: left;
    }

    .bout {
      position: absolute;
      width: 100%;
      min-width: 0;
    }

    .bout-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .bout-date-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 2px 0 6px;
    }

    .bout-date {
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      transition: color 0.3s ease;
    }

    .bout.is-active .bout-date {
      color: #22863a;
    }

    .bout-links {
      margin: 8px 0 0 0;
      display: flex;
      gap: 8px;
      justify-content: flex-start;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .bout-active-indicator {
      display: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2d8e2d;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px #fff, 0 0 0 3px #2d8e2d;
    }

    .bout.is-active .bout-active-indicator {
      display: inline-block;
    }

    .round-column[data-side="left"] .bout-date-container {
      width: 100%;
      justify-content: flex-end;
    }

    .round-column[data-side="right"] .bout-date-container {
      width: 100%;
      flex-direction: row-reverse;
      justify-content: flex-end;
    }

    .round-column[data-side="right"] .bout-active-indicator {
      margin-right: 0;
      margin-left: 2px;
    }

    .bout-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
      text-decoration: none;
      font-size: 8px;
      font-weight: 700;
      text-transform: uppercase;
      transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 2px 6px rgba(63, 36, 18, 0.2);
      position: relative;
      z-index: 2;
    }

    .bout-link:hover {
      background: var(--accent);
      color: var(--panel);
      box-shadow: 0 4px 10px rgba(63, 36, 18, 0.3);
    }

    .bout.is-active .bout-link {
      background: #c1e9c1;
      color: #2d8e2d;
      box-shadow: 0 2px 6px rgba(45, 142, 45, 0.3);
    }

    .bout.is-active .bout-link:hover {
      background: #2d8e2d;
      color: #fff;
      box-shadow: 0 4px 10px rgba(45, 142, 45, 0.4);
    }

    .round-column[data-side="left"] .bout-links {
      justify-content: flex-end;
    }

    .matchup {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      transition: border-color 0.3s ease, background-color 0.3s ease;
    }

    .matchup.is-active {
      border: 2px solid #2d8e2d;
      background: #f0fdf4;
    }

    .competitor {
      display: block;
      width: 100%;
      min-height: 31px;
      padding: 8px 10px;
      border: 0;
      border-bottom: 1px solid #eadbc8;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 12px;
      line-height: 1.2;
      text-align: inherit;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .bout.is-active .competitor {
      border-bottom-color: #c1e9c1;
    }

    .competitor:last-child {
      border-bottom: 0;
    }

    .competitor:hover:not(:disabled),
    .competitor:focus-visible:not(:disabled) {
      outline: none;
      background: var(--accent-soft);
    }

    .bout.is-active .competitor:hover:not(:disabled),
    .bout.is-active .competitor:focus-visible:not(:disabled) {
      background: #d4f1d4;
    }

    .competitor.is-winner {
      background: var(--accent);
      color: #fffdf9;
      font-weight: 700;
    }

    .competitor.is-winner:hover:not(:disabled),
    .competitor.is-winner:focus-visible:not(:disabled) {
      background: #a8531f;
    }

    .bout.is-active .competitor.is-winner {
      background: #2d8e2d;
      color: #fff;
    }

    .bout.is-active .competitor.is-winner:hover:not(:disabled),
    .bout.is-active .competitor.is-winner:focus-visible:not(:disabled) {
      background: #3da53d;
    }

    .competitor:disabled {
      color: #978a80;
      cursor: default;
    }

    .bout[data-round="5"] {
      text-align: center;
    }

    .bout[data-round="5"] .bout-label {
      text-transform: uppercase;
    }

    .bout[data-round="5"] .bout-date-container {
      justify-content: center;
    }

    .bout[data-round="5"] .bout-links {
      justify-content: center;
    }

    .championship {
      position: relative;
      min-height: 1px;
      text-align: center;
    }

    .championship .bout {
      position: absolute;
    }

    .champion {
      position: absolute;
      width: 100%;
      border: 2px solid #7c551d;
      border-radius: 8px;
      background: linear-gradient(180deg, #ffe9a8, #ffd769);
      box-shadow: var(--shadow);
      padding: 13px 10px;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
      min-height: 46px;
    }

    @media (max-width: 719px) {
      h1 {
        font-size: 24px;
        line-height: 1.15;
      }

      .bracket-shell {
        padding: 16px;
        overflow-x: visible;
      }

      .bracket-stage {
        width: auto;
        margin: 0;
      }

      .bracket {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
        min-height: auto;
        padding: 0;
      }

      .round-column {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .round-column[data-side="left"],
      .round-column[data-side="right"] {
        text-align: center;
      }

      .bout {
        position: static !important;
        width: 100%;
        margin: 0;
        top: auto !important;
        transform: none !important;
      }

      .round-column::before {
        content: attr(data-round);
        grid-column: 1 / -1;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 4px;
        text-align: center;
      }

      .bout-label {
        font-size: 10px;
        margin-bottom: 4px;
        text-align: center;
      }

      .bout-date-container {
        justify-content: center;
        flex-direction: row;
      }

      .bout-date {
        font-size: 10px;
      }

      .bout-active-indicator {
        width: 6px;
        height: 6px;
        margin: 0 0 0 6px;
      }

      .bout-links {
        margin: 6px 0 0 0;
        gap: 6px;
        justify-content: center;
      }

      .bout-link {
        width: 18px;
        height: 18px;
        font-size: 7px;
      }

      .round-column[data-side="left"] .bout-date-container,
      .round-column[data-side="right"] .bout-date-container {
        justify-content: center;
        flex-direction: row;
      }

      .round-column[data-side="left"] .bout-active-indicator,
      .round-column[data-side="right"] .bout-active-indicator {
        margin-right: 0;
        margin-left: 6px;
      }

      .matchup {
        border-radius: 6px;
      }

      .competitor {
        font-size: 11px;
        padding: 6px 8px;
        min-height: 28px;
      }

      .championship {
        grid-column: 1 / -1;
        text-align: center;
        width: 100%;
        margin: 20px 0 0 0;
        padding-top: 20px;
        border-top: 2px solid var(--border);
      }

      .championship .bout {
        position: static;
        width: 100%;
        margin: 0 auto 16px;
      }

      .championship .bout::before {
        display: none;
      }

      .champion {
        width: 100%;
        font-size: 12px;
        padding: 12px 8px;
        min-height: 44px;
        position: static;
      }

      .connectors {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Virginia Whiskey Tournament 2026</h1>
    <p style="color: var(--muted); font-size: 12px; margin: 8px 0 0 0; font-weight: 500;">All voting closes at noon EDT on the end date.</p>
  </header>

  <main class="bracket-shell">
    <div class="bracket-stage">
      <svg class="connectors" aria-hidden="true"></svg>
      <section class="bracket" id="bracket" aria-label="Virginia Whiskey Tournament 2026 bracket"></section>
    </div>
  </main>

  <script>
    const firstRound = [
      ["Open Road", "Brady's", "Old House", "3 Crosses"],
      ["New Realm", "Lost Whiskey Co", "Highlands", "Springfield"],
      ["KO Distilling", "Mean Spirits", "Reservoir"],
      ["Deep Creek", "Five Mile Mountain", "Ironclad"],
      ["River Hill", "Cape Charles", "Virginia Distillery Co"],
      ["Silverback", "River City", "Spirit Lab"],
      ["Reverend Spirits", "Bon Durant Brothers", "Twin Creeks", "GW's Grist Mill"],
      ["Ragged Branch", "Devil's Backbone", "Tarnished Truth", "Blue Sky"],
      ["Blue Shepherd", "Caiseal", "Bold Rock"],
      ["Three Wives", "Davis Valley", "Climax"],
      ["Filibuster", "A. Smith Bowman", "Mt Defiance"],
      ["Catoctin Creek", "Virginia Foothills", "Copper Fox"],
      ["Appalachian Heritage", "Sandy River", "Belmont Farm"],
      ["Creek Bottom", "Cool Springs", "Trial & Error", "J.H. Bards"],
      ["Murlarkey", "Three Notches", "Lincoln Ridge", "Hilltop"],
      ["Sleepy Fox", "Bell Isle", "Franklin County", "Axe Handle"]
    ];

    const rounds = [
      { round: 1, bouts: 16 },
      { round: 2, bouts: 8 },
      { round: 3, bouts: 4 },
      { round: 4, bouts: 2 },
      { round: 5, bouts: 1 }
    ];

    const boutDates = {
      r1b1:  { start: "2026-05-30", end: "2026-06-05" },
      r1b2:  { start: "2026-05-30", end: "2026-06-05" },
      r1b3:  { start: "2026-06-06", end: "2026-06-12" },
      r1b4:  { start: "2026-06-06", end: "2026-06-12" },
      r1b5:  { start: "2026-06-13", end: "2026-06-19" },
      r1b6:  { start: "2026-06-13", end: "2026-06-19" },
      r1b7:  { start: "2026-06-20", end: "2026-06-26" },
      r1b8:  { start: "2026-06-20", end: "2026-06-26" },
      r1b9:  { start: "2026-06-27", end: "2026-07-03" },
      r1b10: { start: "2026-06-27", end: "2026-07-03" },
      r1b11: { start: "2026-07-04", end: "2026-07-10" },
      r1b12: { start: "2026-07-04", end: "2026-07-10" },
      r1b13: { start: "2026-07-11", end: "2026-07-17" },
      r1b14: { start: "2026-07-11", end: "2026-07-17" },
      r1b15: { start: "2026-07-18", end: "2026-07-24" },
      r1b16: { start: "2026-07-18", end: "2026-07-24" },
      r2b1:  { start: "2026-07-25", end: "2026-07-31" },
      r2b2:  { start: "2026-08-01", end: "2026-08-07" },
      r2b3:  { start: "2026-08-08", end: "2026-08-14" },
      r2b4:  { start: "2026-08-15", end: "2026-08-21" },
      r2b5:  { start: "2026-08-22", end: "2026-08-28" },
      r2b6:  { start: "2026-08-29", end: "2026-09-04" },
      r2b7:  { start: "2026-09-05", end: "2026-09-11" },
      r2b8:  { start: "2026-09-12", end: "2026-09-18" },
      r3b1:  { start: "2026-09-19", end: "2026-09-25" },
      r3b2:  { start: "2026-09-26", end: "2026-10-02" },
      r3b3:  { start: "2026-10-03", end: "2026-10-09" },
      r3b4:  { start: "2026-10-10", end: "2026-10-16" },
      r4b1:  { start: "2026-10-17", end: "2026-10-23" },
      r4b2:  { start: "2026-10-24", end: "2026-10-30" },
      r5b1:  { start: "2026-10-31", end: "2026-11-06" },
    };

    const boutLinks = {
      // Add bout links here as polls go live

      // Example:
      // r1b1: { instagram: "https://instagram.com/...", twitter: "https://x.com/...", youtube: "https://youtube.com/...", discord: "https://discord.gg/..." },

      r1b1: {
        instagram: "https://www.instagram.com/p/DZDF_ikASrH/",
        youtube: "https://www.youtube.com/post/UgkxUmjksF2IY9cTtGlu9wRG0uFsW-KZ0O22",
      },
      r1b2: {
        instagram: "https://www.instagram.com/p/DZDGxpYgkms/",
        youtube: "https://www.youtube.com/post/Ugkxb0oL3X_mBtAPzHmf5X9Y8oiwGaqwgfVW",
      },
    };

    const bracket = document.querySelector("#bracket");
    const connectors = document.querySelector(".connectors");
    const winners = new Map();

    function key(round, bout) {
      return `r${round}b${bout}`;
    }

    function sideForBout(bout) {
      return bout % 2 === 1 ? "left" : "right";
    }

    function columnFor(round, side) {
      if (round === 5) return 5;
      return side === "left" ? round : 10 - round;
    }

    function boutDate(round, bout) {
      const entry = boutDates[`r${round}b${bout}`];
      if (!entry) return "";
      const fmt = { month: "short", day: "numeric", timeZone: "UTC" };
      const start = new Date(entry.start).toLocaleDateString("en-US", fmt);
      const end   = new Date(entry.end).toLocaleDateString("en-US", fmt);
      return `${start} – ${end}`;
    }

    function isActiveBout(round, bout) {
      const entry = boutDates[`r${round}b${bout}`];
      if (!entry) return false;
      const now = new Date();
      const startDate = new Date(entry.start + "T12:00:00-04:00");
      const endDate = new Date(entry.end + "T12:00:00-04:00");
      return now >= startDate && now <= endDate;
    }

    function feedersFor(round, bout) {
      if (round === 5) {
        return [
          { round: 4, bout: 1 },
          { round: 4, bout: 2 }
        ];
      }

      const sideIndex = Math.ceil(bout / 2);
      const firstFeeder = bout % 2 === 1 ? (sideIndex * 4) - 3 : (sideIndex * 4) - 2;
      return [
        { round: round - 1, bout: firstFeeder },
        { round: round - 1, bout: firstFeeder + 2 }
      ];
    }

    function targetFor(round, bout) {
      if (round === 4) {
        return { round: 5, bout: 1 };
      }

      const sideIndex = Math.ceil(bout / 2);
      const nextSideIndex = Math.ceil(sideIndex / 2);
      const nextBout = bout % 2 === 1 ? (nextSideIndex * 2) - 1 : nextSideIndex * 2;
      return { round: round + 1, bout: nextBout };
    }

    function entrantsFor(round, bout) {
      if (round === 1) return firstRound[bout - 1];
      if (round === 5) return [winners.get(key(4, 1)) || "Round 4 Bout 1 Winner", winners.get(key(4, 2)) || "Round 4 Bout 2 Winner"];

      return feedersFor(round, bout).map((feeder) => {
        return winners.get(key(feeder.round, feeder.bout)) || `Round ${feeder.round} Bout ${feeder.bout} Winner`;
      });
    }

    function clearDownstream(round, bout) {
      let target = targetFor(round, bout);

      while (target.round <= 5) {
        winners.delete(key(target.round, target.bout));
        if (target.round === 5) break;
        target = targetFor(target.round, target.bout);
      }
    }

    function selectWinner(round, bout, winner) {
      clearDownstream(round, bout);
      winners.set(key(round, bout), winner);
      render();
    }

    function createBout(round, bout) {
      const boutEl = document.createElement("article");
      boutEl.className = "bout";
      if (isActiveBout(round, bout)) {
        boutEl.classList.add("is-active");
      }
      boutEl.dataset.round = round;
      boutEl.dataset.bout = bout;
      boutEl.dataset.side = round === 5 ? "center" : sideForBout(bout);

      const label = document.createElement("div");
      label.className = "bout-label";
      label.textContent = round === 5 ? "Final" : `Round ${round} Bout ${bout}`;

      const dateContainer = document.createElement("div");
      dateContainer.className = "bout-date-container";

      const date = document.createElement("div");
      date.className = "bout-date";
      date.textContent = boutDate(round, bout);
      dateContainer.appendChild(date);

      if (isActiveBout(round, bout)) {
        const indicator = document.createElement("div");
        indicator.className = "bout-active-indicator";
        dateContainer.appendChild(indicator);
      }

      const matchup = document.createElement("div");
      matchup.className = "matchup";
      if (isActiveBout(round, bout)) {
        matchup.classList.add("is-active");
      }

      entrantsFor(round, bout).forEach((name) => {
        const competitor = document.createElement("button");
        competitor.type = "button";
        competitor.className = "competitor";
        competitor.textContent = name;
        competitor.disabled = name.includes(" Winner");

        if (winners.get(key(round, bout)) === name) {
          competitor.classList.add("is-winner");
        }

        competitor.addEventListener("click", () => selectWinner(round, bout, name));
        matchup.appendChild(competitor);
      });

      const bodyElements = [label, dateContainer, matchup];

      const boutId = key(round, bout);
      const links = boutLinks[boutId];
      if (links && (links.instagram || links.twitter || links.youtube || links.discord)) {
        const linksContainer = document.createElement("div");
        linksContainer.className = "bout-links";

        const linkConfigs = [
          { key: "instagram", label: "IG", title: "Vote on Instagram" },
          { key: "twitter", label: "X", title: "Vote on X" },
          { key: "youtube", label: "YT", title: "Vote on YouTube" },
          { key: "discord", label: "DC", title: "Join Discord" }
        ];

        linkConfigs.forEach(({ key: linkKey, label: linkLabel, title: linkTitle }) => {
          if (links[linkKey]) {
            const link = document.createElement("a");
            link.className = "bout-link";
            link.href = links[linkKey];
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = linkLabel;
            link.title = linkTitle;
            linksContainer.appendChild(link);
          }
        });

        bodyElements.push(linksContainer);
      }

      boutEl.append(...bodyElements);
      return boutEl;
    }

    function createColumn(round, side) {
      const column = document.createElement("div");
      column.className = "round-column";
      column.dataset.round = round;
      column.dataset.side = side;
      column.style.gridColumn = columnFor(round, side);

      for (let bout = 1; bout <= rounds[round - 1].bouts; bout += 1) {
        if (sideForBout(bout) === side) {
          column.appendChild(createBout(round, bout));
        }
      }

      return column;
    }

    function createCenter() {
      const center = document.createElement("div");
      center.className = "championship";
      center.style.gridColumn = "5";
      center.appendChild(createBout(5, 1));

      const champion = document.createElement("div");
      champion.className = "champion";
      champion.textContent = '🏆 ' + ( winners.get(key(5, 1)) || "Champion" ) + ' 🏆';
      center.appendChild(champion);
      return center;
    }

    function boutElement(round, bout) {
      return document.querySelector(`.bout[data-round="${round}"][data-bout="${bout}"]`);
    }

    function layoutBracket() {
      const firstRoundGap = 46;
      const edgePadding = 10;
      const positions = new Map();

      ["left", "right"].forEach((side) => {
        let cursor = edgePadding;

        for (let bout = 1; bout <= rounds[0].bouts; bout += 1) {
          if (sideForBout(bout) !== side) continue;

          const el = boutElement(1, bout);
          positions.set(key(1, bout), cursor);
          el.style.top = `${cursor}px`;
          el.style.transform = "none";
          cursor += el.offsetHeight + firstRoundGap;
        }
      });

      for (let round = 2; round <= 5; round += 1) {
        for (let bout = 1; bout <= rounds[round - 1].bouts; bout += 1) {
          const el = boutElement(round, bout);
          const feeders = feedersFor(round, bout);
          const feederCenters = feeders.map((feeder) => {
            const feederEl = boutElement(feeder.round, feeder.bout);
            return positions.get(key(feeder.round, feeder.bout)) + (feederEl.offsetHeight / 2);
          });
          const center = feederCenters.reduce((total, item) => total + item, 0) / feederCenters.length;
          const top = center - (el.offsetHeight / 2);

          positions.set(key(round, bout), top);
          el.style.top = `${top}px`;
          el.style.transform = "none";
        }
      }

      const finalBout = boutElement(5, 1);
      const champion = document.querySelector(".champion");
      const championTop = positions.get(key(5, 1)) + finalBout.offsetHeight + 18;
      champion.style.top = `${championTop}px`;

      const maxBottom = Math.max(
        ...Array.from(document.querySelectorAll(".bout")).map((el) => el.offsetTop + el.offsetHeight),
        championTop + champion.offsetHeight
      ) + edgePadding;

      bracket.style.height = `${maxBottom}px`;
      document.querySelectorAll(".round-column, .championship").forEach((column) => {
        column.style.height = `${maxBottom}px`;
      });
      connectors.style.height = `${maxBottom}px`;
    }

    function drawConnectors() {
      connectors.innerHTML = "";
      const svgRect = connectors.getBoundingClientRect();
      connectors.setAttribute("viewBox", `0 0 ${svgRect.width} ${svgRect.height}`);

      function pointFor(el, side) {
        const rect = el.querySelector(".matchup").getBoundingClientRect();
        const x = (side === "left" ? rect.left : rect.right) - svgRect.left;
        const y = rect.top + (rect.height / 2) - svgRect.top;
        return { x, y };
      }

      for (let round = 1; round <= 4; round += 1) {
        for (let bout = 1; bout <= rounds[round - 1].bouts; bout += 1) {
          const source = document.querySelector(`.bout[data-round="${round}"][data-bout="${bout}"]`);
          const next = targetFor(round, bout);
          const target = document.querySelector(`.bout[data-round="${next.round}"][data-bout="${next.bout}"]`);
          if (!source || !target) continue;

          const sourceSide = source.dataset.side;
          const start = pointFor(source, sourceSide === "left" ? "right" : "left");
          const end = pointFor(target, sourceSide === "left" ? "left" : "right");
          const run = Math.max(22, Math.abs(end.x - start.x) * 0.38);
          const c1x = sourceSide === "left" ? start.x + run : start.x - run;
          const c2x = sourceSide === "left" ? end.x - run : end.x + run;
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");

          path.setAttribute("d", `M ${start.x} ${start.y} C ${c1x} ${start.y}, ${c2x} ${end.y}, ${end.x} ${end.y}`);
          connectors.appendChild(path);
        }
      }
    }

    function isMobile() {
      return window.innerWidth < 720;
    }

    function render() {
      bracket.innerHTML = "";

      for (let round = 1; round <= 4; round += 1) {
        bracket.appendChild(createColumn(round, "left"));
      }

      bracket.appendChild(createCenter());

      for (let round = 4; round >= 1; round -= 1) {
        bracket.appendChild(createColumn(round, "right"));
      }

      if (!isMobile()) {
        requestAnimationFrame(() => {
          layoutBracket();
          drawConnectors();
        });
      }
    }

    let wasMobile = isMobile();
    window.addEventListener("resize", () => {
      const nowMobile = isMobile();
      if (wasMobile !== nowMobile) {
        wasMobile = nowMobile;
        requestAnimationFrame(() => {
          if (nowMobile) {
            // Clear inline styles when switching to mobile
            document.querySelectorAll('.bout, .round-column, .championship').forEach(el => {
              el.style.top = '';
              el.style.height = '';
              el.style.transform = '';
            });
            connectors.innerHTML = '';
            connectors.style.display = 'none';
          }
          render();
        });
      } else if (!nowMobile) {
        layoutBracket();
        drawConnectors();
      }
    });
    render();
  </script>
</body>
</html>
