<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAWT Bracket</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Virginia Whiskey Tournament 2026</h1>
    <p style="color: var(--muted); font-size: 12px; margin: 8px 0 0 0; font-weight: 500;">All voting closes at the end of the day (11:59pm EDT) on Friday.</p>
    <nav class="site-nav" aria-label="Site sections">
      <a href="distilleries/index.html">Distillery profiles</a>
    </nav>
    <div class="bracket-actions">
      <button class="reset-selections" id="reset-selections" type="button">Reset selections</button>
    </div>
  </header>

  <main class="bracket-shell">
    <div class="bracket-stage">
      <svg class="connectors" aria-hidden="true"></svg>
      <section class="bracket" id="bracket" aria-label="Virginia Whiskey Tournament 2026 bracket"></section>
    </div>
  </main>

  <script src="bracket.js"></script>
</body>
</html>
