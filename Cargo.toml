[workspace]
resolver = "2"
members = [
    "common",
    "api",
    "discord-bot",
    "scripts/gen-bracket",
]

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
dotenvy     = "0.15"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono      = { version = "0.4", features = ["serde"] }
thiserror   = "1"
